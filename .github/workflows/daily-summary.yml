name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: horizon-daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      # 步骤 1：只读诊断（不再因为 deepseek-chat 别名不在 /models 列表中而报错退出）
      - name: Read-Only Diagnostics & Entrypoint Verification
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          uv run python - << 'PYEOF'
          import os, json, glob, inspect, httpx

          cfg = json.load(open("data/config.json", encoding="utf-8"))
          cfg_model = cfg.get("ai", {}).get("model", "").strip()
          print(f"=== 1. Configured AI Model in data/config.json: '{cfg_model}' ===")

          print("=== 2. Profiles in Repository ===")
          for p in sorted(glob.glob("profiles/**/*", recursive=True)):
              if os.path.isfile(p):
                  print(f" - {p} ({os.path.getsize(p)} bytes)")

          print("=== 3. Verifying Horizon Source Entrypoint (src/ai/analyzer.py) ===")
          from src.ai.analyzer import ContentAnalyzer
          if not hasattr(ContentAnalyzer, "analyze_batch") or not inspect.iscoroutinefunction(ContentAnalyzer.analyze_batch):
              raise SystemExit("FATAL: ContentAnalyzer.analyze_batch async entrypoint not found in src/ai/analyzer.py!")
          print(f" - Verified: ContentAnalyzer.analyze_batch signature = {inspect.signature(ContentAnalyzer.analyze_batch)}")

          api_key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          if not api_key:
              raise SystemExit("FATAL: DEEPSEEK_API_KEY is empty!")
          try:
              r = httpx.get("https://api.deepseek.com/models", headers={"Authorization": f"Bearer {api_key}"}, timeout=15.0)
              r.raise_for_status()
              models = [m.get("id") for m in r.json().get("data", [])]
              print(f"=== 4. DeepSeek Official /models Available (HTTP {r.status_code}) ===\n {models}")
              if cfg_model not in models:
                  print(f"ℹ️ Note: '{cfg_model}' is used as a server-side compatible alias (canonical /models list: {models}). Proceeding normally.")
          except Exception as e:
              print(f"ℹ️ Note: DeepSeek /models check skipped ({e}). Proceeding normally.")
          PYEOF

      # 步骤 2：写入受环境变量 HORIZON_ENABLE_PREFILTER=1 门控的预筛钩子
      - name: Install Pre-Scoring Budget & 7-Day URL Filter Hook
        run: |
          SITE_PKG=$(uv run python -c "import site; print(site.getsitepackages()[0])")
          cat << 'EOF' > "$SITE_PKG/sitecustomize.py"
          import os, sys

          if os.environ.get("HORIZON_ENABLE_PREFILTER") == "1":
              cwd = os.getcwd()
              if cwd not in sys.path:
                  sys.path.insert(0, cwd)

              import re, json, datetime, urllib.request, urllib.parse
              from collections import defaultdict

              def _norm_url(u):
                  u = (u or "").strip()
                  try:
                      p = urllib.parse.urlsplit(u)
                      q = [(k, v) for k, v in urllib.parse.parse_qsl(p.query)
                           if not k.lower().startswith("utm_") and k.lower() not in ("oc", "ref", "from", "spm", "feature", "si")]
                      return urllib.parse.urlunsplit((p.scheme.lower(), p.netloc.lower(), p.path.rstrip("/"), urllib.parse.urlencode(q), ""))
                  except Exception:
                      return u

              def _load_7day_published_urls():
                  repo = os.environ.get("REPO", "starb5682a5-eng/Horizon")
                  gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
                  now = datetime.datetime.now()
                  seen = set()
                  loaded_files = 0
                  errors = []
                  for d in range(1, 8):
                      p_date = (now - datetime.timedelta(days=d)).strftime("%Y-%m-%d")
                      url = f"https://raw.githubusercontent.com/{repo}/gh-pages/_posts/{p_date}-summary-zh.md"
                      headers = {"User-Agent": "Horizon-Prefilter"}
                      if gh_token:
                          headers["Authorization"] = f"token {gh_token}"
                      try:
                          req = urllib.request.Request(url, headers=headers)
                          with urllib.request.urlopen(req, timeout=8) as resp:
                              txt = resp.read().decode("utf-8", errors="ignore")
                              if "### [" in txt:
                                  for u_m in re.findall(r"\]\((https?://[^\s\)]+)\)", txt):
                                      seen.add(_norm_url(u_m))
                                  loaded_files += 1
                      except urllib.error.HTTPError as he:
                          if he.code != 404:
                              errors.append(f"{p_date}:HTTP_{he.code}")
                      except Exception as ex:
                          errors.append(f"{p_date}:{type(ex).__name__}")
                  print(f"🔍 [7-Day History URL Loader] Scanned 7 days: loaded_reports={loaded_files}, unique_urls={len(seen)}, non_404_errors={errors}")
                  return seen

              EN_CORE_RE = re.compile(
                  r"(?<![a-zA-Z0-9])(?:ai|gpt|chatgpt|claude|openai|anthropic|gemini|deepseek|kimi|qwen|"
                  r"llama|mcp|agent[s]?|workflow[s]?|prompt[s]?|cursor|windsurf|v0|bolt|lovable|copilot|"
                  r"n8n|dify|coze|obsidian|notion|runway(?:ml)?|sora|kling|vidu|veo|midjourney|flux|"
                  r"davinci|tts|llm[s]?|rag)(?![a-zA-Z0-9])",
                  re.I
              )
              ZH_CORE_KW = [
                  "智能体", "工作流", "提示词", "大模型", "千问", "豆包", "扣子", "知识库", "笔记",
                  "可灵", "即梦", "视频生成", "短剧", "动画", "动漫", "漫剧", "分镜", "数字人",
                  "配音", "语音", "剪辑", "达芬奇", "剪映", "字幕", "脚本", "生图", "绘图", "编程"
              ]
              EN_ACTION_RE = re.compile(
                  r"(?<![a-zA-Z0-9])(?:release[sd]?|releasing|launch(?:es|ed|ing)?|announc(?:es|ed|ing)|"
                  r"introduce[sd]?|introducing|update[sd]?|updating|open-?source[ds]?|github|guide[s]?|"
                  r"tutorial[s]?|how-to|build(?:s|ing)?|built|automat(?:es|ed|ing|ion)|benchmark[s]?|"
                  r"full-stack|template[s]?|step-by-step|v\d+(?:\.\d+)+|\d+\.\d+)(?![a-zA-Z0-9])",
                  re.I
              )
              ZH_ACTION_KW = [
                  "发布", "上线", "更新", "开源", "免费", "实测", "测评", "教程", "指南", "拆解",
                  "玩法", "技巧", "提效", "自动化", "神器", "全流程", "零代码", "一人公司", "自媒体"
              ]
              EN_LEARNING_RE = re.compile(
                  r"(?<![a-zA-Z0-9])(?:english|vocabulary|grammar|speaking|listening|pronunciation|"
                  r"idiom[s]?|phrase[s]?|expression[s]?|conversation|bbc|podcast|learn(?:ing)?)(?![a-zA-Z0-9])",
                  re.I
              )
              PM_AGILE_RE = re.compile(
                  r"(?<![a-zA-Z0-9])(?:scrum|agile|sprint[s]?|kanban|backlog|retrospective|"
                  r"product owner|scrum master|project management|stakeholder[s]?|delivery|coaching)(?![a-zA-Z0-9])",
                  re.I
              )
              TITLE_NOISE_RE = re.compile(
                  r"(?<![a-zA-Z0-9])(?:is down for|down for everyone|login error|payment declined|"
                  r"account suspended|what is your favou?rite|whats your favou?rite|am i the only one|"
                  r"megathread|daily discussion|weekly thread|shitpost|nsfw)(?![a-zA-Z0-9])",
                  re.I
              )
              ZH_NOISE_KW = ["跌停", "涨停", "a股", "港股", "楼市", "房地产", "买房", "白酒", "茅台", "国足", "男足", "演唱会"]

              TIER1_CATS = {"ai-official", "ai-agent", "ai-tools", "ai-blog", "ai-youtube"}
              TIER2_CATS = {"ai-digest", "ai-news-cn", "efficiency-tools", "ai-video", "github-trending"}
              TIER3_CATS = {"ai-reddit", "tech-business-cn", "business-tech-cn", "english-learning", "project-management"}

              def _get_item_tier_and_feed(item):
                  meta = getattr(item, "metadata", None) or {}
                  cat = str(meta.get("category") or "").strip()
                  stype = str(getattr(item, "source_type", "") or "").lower()
                  feed_name = str(meta.get("feed_name") or stype or "unknown").strip()

                  if cat in TIER1_CATS:
                      return 1, cat, feed_name
                  if cat in TIER2_CATS or stype in ("hackernews", "telegram", "hn", "github") or "github" in stype:
                      return 2, cat, feed_name
                  if cat in TIER3_CATS:
                      return 3, cat, feed_name
                  return 2, cat, feed_name

              def _score_candidate(item, cat, idx):
                  title = str(getattr(item, "title", "") or "")
                  content = str(getattr(item, "content", "") or "")
                  head_snippet = f"{title} {content[:150]}".lower()

                  if title.endswith(" - Reddit"):
                      try:
                          item.title = re.sub(r"\s*-\s*Reddit\s*$", "", title).strip()
                          title = item.title
                      except Exception:
                          pass

                  if TITLE_NOISE_RE.search(title) or any(k in head_snippet for k in ZH_NOISE_KW):
                      return -15.0

                  core_hits = len(set(m.lower() for m in EN_CORE_RE.findall(title))) * 4.0 + len(set(m.lower() for m in EN_CORE_RE.findall(content[:600]))) * 2.0
                  for kw in ZH_CORE_KW:
                      if kw in title:
                          core_hits += 4.0
                      elif kw in content[:600]:
                          core_hits += 2.0

                  if cat == "english-learning":
                      core_hits += len(set(m.lower() for m in EN_LEARNING_RE.findall(f"{title} {content[:400]}"))) * 3.0
                  elif cat == "project-management":
                      core_hits += len(set(m.lower() for m in PM_AGILE_RE.findall(f"{title} {content[:400]}"))) * 3.0

                  act_hits = len(set(m.lower() for m in EN_ACTION_RE.findall(title))) * 3.0 + len(set(m.lower() for m in EN_ACTION_RE.findall(content[:600]))) * 1.5
                  for kw in ZH_ACTION_KW:
                      if kw in title:
                          act_hits += 3.0
                      elif kw in content[:600]:
                          act_hits += 1.5

                  score = core_hits + act_hits
                  if score > 0:
                      clean_c = re.sub(r"<[^>]+>", "", content).strip()
                      if len(clean_c) > 150 and clean_c != title.strip():
                          score += 1.5
                      meta = getattr(item, "metadata", None) or {}
                      if meta.get("score") and isinstance(meta.get("score"), (int, float)) and meta.get("score") >= 150:
                          score += 2.0
                  return score

              from src.ai.analyzer import ContentAnalyzer
              _orig_analyze_batch = ContentAnalyzer.analyze_batch

              async def _budgeted_analyze_batch(self, items, *args, **kwargs):
                  if not isinstance(items, list) or not items or getattr(self, "_in_budget_hook", False):
                      return await _orig_analyze_batch(self, items, *args, **kwargs)

                  self._in_budget_hook = True
                  try:
                      raw_count = len(items)
                      seen_urls = _load_7day_published_urls()
                      items_pool = []
                      dup_dropped = 0
                      for it in items:
                          u = _norm_url(str(getattr(it, "url", "") or ""))
                          if u and u in seen_urls:
                              dup_dropped += 1
                          else:
                              items_pool.append(it)

                      per_feed_buckets = defaultdict(list)
                      for idx, it in enumerate(items_pool):
                          tier, cat, fname = _get_item_tier_and_feed(it)
                          sc = _score_candidate(it, cat, idx)
                          per_feed_buckets[(tier, cat, fname)].append((sc, idx, it))

                      tier_buckets = {1: [], 2: [], 3: []}
                      print("\n📊 === [Pre-Scoring Source Audit (7-Day URL Dedup + Category Relevance Filter)] ===")
                      for (tier, cat, fname), entry_list in sorted(per_feed_buckets.items(), key=lambda x: (x[0][0], x[0][2])):
                          entry_list.sort(key=lambda x: (x[0], -x[1]), reverse=True)
                          if cat == "ai-official":
                              min_sc, cap = 0.0, 5
                          elif cat == "ai-reddit":
                              min_sc, cap = 6.0, 4
                          elif tier == 3:
                              min_sc, cap = 4.0, 4
                          elif tier == 1:
                              min_sc, cap = 2.0, 5
                          else:
                              min_sc, cap = 2.0, 5

                          qualified = [x for x in entry_list if x[0] >= min_sc]
                          low_rel_cnt = len(entry_list) - len(qualified)
                          kept = qualified[:cap]
                          tier_buckets[tier].extend(kept)
                          print(f" - [Tier {tier} | {cat or 'native'}] {fname}: 24h_new={len(entry_list)} | low_rel_dropped={low_rel_cnt} -> feed_kept={len(kept)}")

                      GLOBAL_CAP = 60
                      QUOTAS = {1: 28, 2: 18, 3: 14}
                      final_items = []
                      carry = 0
                      for t in (1, 2, 3):
                          tier_buckets[t].sort(key=lambda x: (x[0], -x[1]), reverse=True)
                          allow = QUOTAS[t] + carry
                          taken = [x[2] for x in tier_buckets[t][:allow]]
                          final_items.extend(taken)
                          carry = max(0, allow - len(taken))

                      final_items = final_items[:GLOBAL_CAP]
                      items[:] = final_items
                      print(f"🎯 [Global Pre-Scoring Budget] Raw 24h={raw_count} | 7-Day Dup Dropped={dup_dropped} | Qualified (T1={len(tier_buckets[1])}, T2={len(tier_buckets[2])}, T3={len(tier_buckets[3])}) -> In-Place Mutated & Sent to DeepSeek={len(items)}/{GLOBAL_CAP}\n")
                      return await _orig_analyze_batch(self, items, *args, **kwargs)
                  finally:
                      self._in_budget_hook = False

              ContentAnalyzer.analyze_batch = _budgeted_analyze_batch
          EOF

      # 步骤 3：独立断言钩子已挂载成功
      - name: Verify Pre-Scoring Hook Active
        env:
          HORIZON_ENABLE_PREFILTER: "1"
        run: |
          uv run python -c '
          from src.ai.analyzer import ContentAnalyzer
          fn_name = getattr(ContentAnalyzer.analyze_batch, "__name__", "")
          print(f"Checking ContentAnalyzer.analyze_batch.__name__ = {fn_name}")
          assert fn_name == "_budgeted_analyze_batch", f"FATAL: Hook not active! Got {fn_name}"
          print("✅ Pre-scoring budget hook verified active!")
          '

      # 步骤 4：运行 Horizon
      - name: Run Horizon
        env:
          HORIZON_ENABLE_PREFILTER: "1"
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLUMNS: "200"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          uv run horizon --hours 24 | tee data/horizon_run.log

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'\%Y-\%m-\%d')" >> $GITHUB_ENV

      # 步骤 5：跨天同事件语义去重 + 同日同 AI 合并
      - name: Consolidate Same-AI & Deduplicate Cross-Day
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python - << 'PYEOF'
          import os, re, json, shutil, datetime, urllib.request, urllib.parse, httpx

          cfg = json.load(open("data/config.json", encoding="utf-8"))
          cfg_model = cfg.get("ai", {}).get("model", "deepseek-chat").strip()

          bj_now = datetime.datetime.now()
          utc_now = datetime.datetime.now(datetime.timezone.utc)
          date_str = bj_now.strftime("%Y-%m-%d")
          utc_date_str = utc_now.strftime("%Y-%m-%d")

          summary_path = f"data/summaries/horizon-{date_str}-zh.md"
          pages_path = f"docs/_posts/{date_str}-summary-zh.md"
          manifest_path = f"data/summaries/must_keep_urls-{date_str}.json"

          if not os.path.exists(summary_path) and os.path.exists(f"data/summaries/horizon-{utc_date_str}-zh.md"):
              shutil.move(f"data/summaries/horizon-{utc_date_str}-zh.md", summary_path)
          if not os.path.exists(pages_path) and os.path.exists(f"docs/_posts/{utc_date_str}-summary-zh.md"):
              shutil.move(f"docs/_posts/{utc_date_str}-summary-zh.md", pages_path)

          if not os.path.exists(summary_path):
              print(f"No summary file found at {summary_path}, skipping consolidation.")
              raise SystemExit(0)

          def fix_header_dates_only(md_text, target_date):
              def repl_yaml(m):
                  return re.sub(r"\d{4}-\d{2}-\d{2}", target_date, m.group(0))
              md_text = re.sub(r"\A---\s*\n[\s\S]*?\n---\s*\n", repl_yaml, md_text, count=1)
              md_text = re.sub(r"^(#\s*Horizon\s*每日速递\s*-\s*)\d{4}-\d{2}-\d{2}", rf"\g<1>{target_date}", md_text, count=1, flags=re.M)
              return md_text

          def write_verified_outputs(md_body, target_date):
              os.makedirs("docs/_posts", exist_ok=True)
              header = f"---\nlayout: default\ntitle: \"Horizon Summary: {target_date} (ZH)\"\ndate: {target_date}\nlang: zh\n---\n\n"
              if os.path.exists(pages_path):
                  pages_txt = open(pages_path, encoding="utf-8").read()
                  m = re.match(r"\A(---\s*\n[\s\S]*?\n---\s*\n)", pages_txt)
                  if m:
                      header = re.sub(r"\d{4}-\d{2}-\d{2}", target_date, m.group(1))
              tmp_sum = summary_path + ".tmp"
              tmp_pages = pages_path + ".tmp"
              with open(tmp_sum, "w", encoding="utf-8") as f1:
                  f1.write(md_body.strip() + "\n")
              with open(tmp_pages, "w", encoding="utf-8") as f2:
                  f2.write(header + md_body.strip() + "\n")
              os.replace(tmp_sum, summary_path)
              os.replace(tmp_pages, pages_path)

          def norm_url(u):
              u = (u or "").strip()
              try:
                  p = urllib.parse.urlsplit(u)
                  q = [(k, v) for k, v in urllib.parse.parse_qsl(p.query)
                       if not k.lower().startswith("utm_") and k.lower() not in ("oc", "ref", "from", "spm", "feature", "si")]
                  return urllib.parse.urlunsplit((p.scheme.lower(), p.netloc.lower(), p.path.rstrip("/"), urllib.parse.urlencode(q), ""))
              except Exception:
                  return u

          raw_md = fix_header_dates_only(open(summary_path, encoding="utf-8").read(), date_str)
          write_verified_outputs(raw_md, date_str)

          if "### [" not in raw_md:
              print("Info: Horizon selected 0 items today. Saving empty manifest.")
              json.dump({"primary_urls": [], "has_history": False}, open(manifest_path, "w", encoding="utf-8"))
              raise SystemExit(0)

          repo = os.environ.get("REPO", "starb5682a5-eng/Horizon")
          gh_token = os.environ.get("GITHUB_TOKEN",
