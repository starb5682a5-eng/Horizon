name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: horizon-daily-summary
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      # 步骤 1：直接运行 Horizon 官方主流程（去除所有不稳定钩子，确保 100% 不会发生断言崩溃）
      - name: Run Horizon
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLUMNS: "200"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          uv run horizon --hours 24 | tee data/horizon_run.log

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # 步骤 2：跨天同事件语义去重 + 预算精简合并 + 7 项结构完整性校验
      - name: Consolidate Same-AI & Deduplicate Cross-Day
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python - << 'PYEOF'
          import os, re, json, shutil, datetime, urllib.request, urllib.parse, httpx

          cfg = json.load(open("data/config.json", encoding="utf-8"))
          cfg_model = cfg.get("ai", {}).get("model", "deepseek-chat").strip()
          bj_now = datetime.datetime.now()
          utc_now = datetime.datetime.now(datetime.timezone.utc)
          date_str = bj_now.strftime("%Y-%m-%d")
          utc_date_str = utc_now.strftime("%Y-%m-%d")

          summary_path = f"data/summaries/horizon-{date_str}-zh.md"
          pages_path = f"docs/_posts/{date_str}-summary-zh.md"
          manifest_path = f"data/summaries/must_keep_urls-{date_str}.json"

          if not os.path.exists(summary_path) and os.path.exists(f"data/summaries/horizon-{utc_date_str}-zh.md"):
              shutil.move(f"data/summaries/horizon-{utc_date_str}-zh.md", summary_path)
          if not os.path.exists(pages_path) and os.path.exists(f"docs/_posts/{utc_date_str}-summary-zh.md"):
              shutil.move(f"docs/_posts/{utc_date_str}-summary-zh.md", pages_path)

          def set_ready(flag):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"ready={'true' if flag else 'false'}\n")

          if not os.path.exists(summary_path):
              print("No summary file found.")
              set_ready(False)
              raise SystemExit(0)

          def fix_dates(txt):
              txt = re.sub(r"\A---\s*\n[\s\S]*?\n---\s*\n", lambda m: re.sub(r"\d{4}-\d{2}-\d{2}", date_str, m.group(0)), txt, count=1)
              return re.sub(r"^(#\s*Horizon\s*每日速递\s*-\s*)\d{4}-\d{2}-\d{2}", rf"\g<1>{date_str}", txt, count=1, flags=re.M)

          def save_both(body):
              os.makedirs("docs/_posts", exist_ok=True)
              hdr = f"---\nlayout: default\ntitle: \"Horizon Summary: {date_str} (ZH)\"\ndate: {date_str}\nlang: zh\n---\n\n"
              with open(summary_path + ".tmp", "w", encoding="utf-8") as f1:
                  f1.write(body.strip() + "\n")
              with open(pages_path + ".tmp", "w", encoding="utf-8") as f2:
                  f2.write(hdr + body.strip() + "\n")
              os.replace(summary_path + ".tmp", summary_path)
              os.replace(pages_path + ".tmp", pages_path)

          def norm_url(u):
              try:
                  p = urllib.parse.urlsplit((u or "").strip())
                  q = [(k, v) for k, v in urllib.parse.parse_qsl(p.query) if not k.lower().startswith("utm_") and k.lower() not in ("oc", "ref", "from", "spm", "feature", "si")]
                  return urllib.parse.urlunsplit((p.scheme.lower(), p.netloc.lower(), p.path.rstrip("/"), urllib.parse.urlencode(q), ""))
              except Exception:
                  return (u or "").strip()

          raw_md = fix_dates(open(summary_path, encoding="utf-8").read())
          save_both(raw_md)

          if "### [" not in raw_md:
              print("Selected 0 items today.")
              set_ready(False)
              raise SystemExit(0)

          repo = os.environ.get("REPO", "starb5682a5-eng/Horizon")
          gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
          prev_reports = []
          for d in range(1, 8):
              if len(prev_reports) >= 2:
                  break
              p_date = (bj_now - datetime.timedelta(days=d)).strftime("%Y-%m-%d")
              url = f"https://raw.githubusercontent.com/{repo}/gh-pages/_posts/{p_date}-summary-zh.md"
              headers = {"User-Agent": "Horizon"}
              if gh_token:
                  headers["Authorization"] = f"token {gh_token}"
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=8) as r:
                      txt = r.read().decode("utf-8", errors="ignore")
                      blocks = re.findall(r"###\s+\[(.*?)\]\((https?://[^\s\)]+)\).*?\n+([\s\S]*?)(?=\n<a id=\"|\n###\s+\[|\n---\n|\Z)", txt)
                      if blocks:
                          items_str = [f"- 标题: {t} | 链接: {u} | 摘要: {re.sub(r'\\s+', ' ', b).strip()[:280]}" for t, u, b in blocks[:20]]
                          prev_reports.append(f"【{p_date} 已发记录】:\n" + "\n".join(items_str))
              except Exception:
                  pass

          primary_urls = set(norm_url(u) for u in re.findall(r"^###\s+\[.*?\]\((https?://[^\s\)]+)\)", raw_md, flags=re.M))
          api_key = os.environ.get("DEEPSEEK_API_KEY", "").strip()

          if api_key and (len(primary_urls) > 1 or prev_reports):
              sys_p = f"""你是一位资深 AI 自媒体主编。请对今日日报执行【跨天同事件去重】与【同日同 AI 结构化合并】：
              1. 跨天去重：对照历史记录，仅当今日资讯与历史记录属于【同一具体事件/同一案例】时才剔除（并在文末最后一行注明 `<!-- DROPPED_URLS: URL1, URL2 -->`）；若是同一 AI 的不同新功能、新玩法或新测评，必须 100% 保留！
              2. 同日同 AI 合并：同一份日报内，每个核心 AI（如 Claude、ChatGPT、Gemini）在目录和正文中只设 1 个主词条；将该 AI 当天其余不同新动态放在该词条正文下方的「📌 **同日该 AI 其他重要动态汇总**：」子列表中，完整保留每条子动态的核心事实与原始链接 `[原题](原始URL)`！
              3. 严格排版：顶部主标题为 `# Horizon 每日速递 - {date_str}`；导语为 `> 从原始资讯中去重并归纳合并出 X 条高价值核心情报。`；目录编号 `1..X`、正文锚点 `<a id="item-ai-creator-1"></a>` 与正文 `### [标题](链接)` 数量必须严格相等且从 1 连续递增；保留 `⭐️`、来源时间行、角度与 `**标签**:`；直接输出纯 Markdown。"""
              usr_p = f"<untrusted_history>\n{chr(10).join(prev_reports) if prev_reports else '无'}\n</untrusted_history>\n\n<untrusted_today>\n{raw_md}\n</untrusted_today>"
              try:
                  resp = httpx.post(
                      "https://api.deepseek.com/chat/completions",
                      headers={"Authorization": f"Bearer {api_key}"},
                      json={"model": cfg_model, "messages": [{"role": "system", "content": sys_p}, {"role": "user", "content": usr_p}], "temperature": 0.2, "max_tokens": 8192},
                      timeout=180.0
                  )
                  resp.raise_for_status()
                  rj = resp.json()
                  u = rj.get("usage", {})
                  in_t, out_t = u.get("prompt_tokens", 0), u.get("completion_tokens", 0)
                  h_in, h_out = 0, 0
                  if os.path.exists("data/horizon_run.log"):
                      m_t = re.search(r"Token usage this run:\s*\d+\s*tokens\s*\(input:\s*(\d+),\s*output:\s*(\d+)\)", open("data/horizon_run.log", encoding="utf-8", errors="ignore").read())
                      if m_t:
                          h_in, h_out = int(m_t.group(1)), int(m_t.group(2))
                  cost = ((h_in + in_t) * 2.0 + (h_out + out_t) * 8.0) / 1_000_000
                  print(f"💰 [Daily Total Cost Ledger] Horizon(in={h_in}, out={h_out}) + Consolidation(in={in_t}, out={out_t}) => Total In={h_in+in_t}, Total Out={h_out+out_t} | Est. Cost ≈ ¥{cost:.4f} RMB")

                  if rj["choices"][0].get("finish_reason") == "stop":
                      new_md = re.sub(r"\s*```$", "", re.sub(r"^```(?:markdown)?\s*", "", rj["choices"][0]["message"]["content"].strip()))
                      dropped = set(norm_url(x) for m in re.findall(r"<!--\s*DROPPED_URLS:\s*(.*?)\s*-->", new_md) for x in re.findall(r"https?://[^\s,>]+", m) if norm_url(x) in primary_urls) if prev_reports else set()
                      new_md = fix_dates(re.sub(r"\n*<!--\s*DROPPED_URLS:.*?-->\s*", "\n", new_md).strip())
                      toc_l = re.findall(r"^\d+\.\s+\[.*?\]\(#(item-[a-zA-Z0-9_-]+)\)", new_md, flags=re.M)
                      anc = re.findall(r'<a id="(item-[a-zA-Z0-9_-]+)"></a>', new_md)
                      h3_b = re.split(r"(?=^###\s+\[)", new_md, flags=re.M)[1:]
                      out_u = set(norm_url(x) for x in re.findall(r"\]\((https?://[^\s\)]+)\)", new_md))
                      if f"# Horizon 每日速递 - {date_str}" in new_md and len(h3_b) >= 1 and toc_l == anc and len(toc_l) == len(h3_b) and all(("⭐️" in b and "标签" in b) for b in h3_b) and primary_urls.issubset(out_u | dropped):
                          save_both(new_md)
                          print(f"✅ Consolidated into {len(h3_b)} items successfully!")
                      else:
                          print("ℹ️ Consolidation validation skipped, keeping original Horizon summary.")
              except Exception as e:
                  print(f"ℹ️ Consolidation skipped ({e}), keeping original Horizon summary.")

          final_txt = open(summary_path, encoding="utf-8").read()
          h3_cnt = len(re.findall(r"^###\s+\[.*?\]\(https?://", final_txt, flags=re.M))
          is_ready = (f"# Horizon 每日速递 - {date_str}" in final_txt and h3_cnt >= 1)
          print(f"✅ Final Report Ready={is_ready} ({h3_cnt} items)")
          json.dump({"primary_urls": list(primary_urls)}, open(manifest_path, "w", encoding="utf-8"))
          set_ready(is_ready)
          PYEOF

      - name: Deploy to GitHub Pages
        if: steps.verify_report.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Send to Telegram
        if: always() && !cancelled() && steps.verify_report.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run python - << 'PYEOF'
          import os, datetime, httpx
          date_str = datetime.datetime.now().strftime("%Y-%m-%d")
          file_path = f"data/summaries/horizon-{date_str}-zh.md"
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          text = open(file_path, encoding="utf-8").read()
          preview = text[:1500] + ("\n\n...(完整内容请查阅下方 Markdown 附件)" if len(text) > 1500 else "")
          r1 = httpx.post(f"https://api.telegram.org/bot{bot_token}/sendMessage", data={"chat_id": chat_id, "text": preview}, timeout=30.0)
          assert r1.json().get("ok") is True, f"sendMessage failed: {r1.text}"
          with open(file_path, "rb") as f:
              r2 = httpx.post(f"https://api.telegram.org/bot{bot_token}/sendDocument", data={"chat_id": chat_id, "caption": f"📅 Horizon AI 自媒体选题日报 ({date_str})"}, files={"document": (os.path.basename(file_path), f, "text/markdown")}, timeout=60.0)
          assert r2.json().get("ok") is True, f"sendDocument failed: {r2.text}"
          print("✅ Telegram message and document sent successfully!")
          PYEOF

      - name: Notify Telegram on Failure or Empty Digest
        if: always() && !cancelled() && (failure() || steps.verify_report.outputs.ready != 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          READY_FLAG: ${{ steps.verify_report.outputs.ready }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          MSG="⚠️ Horizon 日报状态提醒 (${DATE})%0A运行状态: ${JOB_STATUS}%0A日报就绪: ${READY_FLAG}%0A说明: 今日无新增资讯或工作流异常，请查看 GitHub Actions 日志。"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MSG}" > /dev/null || true
