name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          COLUMNS: "200"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      # 新增：自动加上 Obsidian 属性头并存回 main 分支，供本地直接下载
      - name: Format for Obsidian and Save to Repo
        run: |
          DATE=$(date +'%Y-%m-%d')
          FILE="data/summaries/horizon-${DATE}-zh.md"
          if [ -f "$FILE" ]; then
            printf -- "---\ntitle: \"AI 自媒体选题日报 %s\"\ndate: %s\ntags:\n  - AI日报\n  - 选题素材\n  - Horizon\nstatus: 待审阅\n---\n\n" "$DATE" "$DATE" > temp.md
            cat "$FILE" >> temp.md
            mv temp.md "$FILE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "📥 Archive Obsidian Daily Summary: ${DATE}" || echo "No changes to commit"
            git push origin main
          fi

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          FILE="data/summaries/horizon-${DATE}-zh.md"
          if [ -f "$FILE" ]; then
            echo "Sending file: $FILE"
            PREVIEW=$(head -c 3800 "$FILE")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                 -d "chat_id=${TELEGRAM_CHAT_ID}" \
                 --data-urlencode "text=${PREVIEW}" > /dev/null
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                 -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "document=@${FILE}" \
                 -F "caption=📅 Horizon AI 自媒体选题日报 (${DATE})" > /dev/null
            echo "Telegram message and document sent successfully!"
          else
            echo "File not found: $FILE"
          fi
